app-id: io.github.raphael_soares.syncfast
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: syncfast-gui

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --filesystem=home
  - --filesystem=/run/media
  - --filesystem=/mnt
  - --filesystem=xdg-config/systemd:create
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  - --system-talk-name=org.freedesktop.NetworkManager

modules:
  - name: rclone
    buildsystem: simple
    build-commands:
      - install -Dm755 rclone /app/bin/rclone
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/rclone/rclone/releases/download/v1.75.2/rclone-v1.75.2-linux-amd64.zip
        sha256: 349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702
        strip-components: 1
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/rclone/rclone/releases/download/v1.75.2/rclone-v1.75.2-linux-arm64.zip
        sha256: 7e1e8d69654941b7b7df84ee74c5f7fb09cce7d5496947fb7bf16b55ff427d10
        strip-components: 1

  - name: restic
    buildsystem: simple
    build-commands:
      - bzip2 -dc restic.bz2 > restic
      - install -Dm755 restic /app/bin/restic
    sources:
      - type: file
        only-arches: [x86_64]
        url: https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2
        sha256: f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c
        dest-filename: restic.bz2
      - type: file
        only-arches: [aarch64]
        url: https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_arm64.bz2
        sha256: a5f64aaab53d51e311fa3829124c5b703f2d14cf187d8640b6be3b2b49376465
        dest-filename: restic.bz2

  - name: syncfast
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/syncfast/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --offline --locked --release --jobs "${FLATPAK_BUILDER_N_JOBS}" -p syncfast-cli -p syncfast-gui
      - install -Dm755 target/release/syncfast /app/bin/syncfast
      - install -Dm755 target/release/syncfast-gui /app/bin/syncfast-gui
      - install -Dm644 packaging/flatpak/io.github.raphael_soares.syncfast.desktop -t /app/share/applications
      - install -Dm644 packaging/flatpak/io.github.raphael_soares.syncfast.metainfo.xml -t /app/share/metainfo
      - install -Dm644 crates/syncfast-gui/assets/app-icon/syncfast.svg /app/share/icons/hicolor/scalable/apps/io.github.raphael_soares.syncfast.svg
      - |
        for size in 16 32 48 64 128 256 512; do
          install -Dm644 crates/syncfast-gui/assets/app-icon/syncfast-$size.png \
            /app/share/icons/hicolor/${size}x${size}/apps/io.github.raphael_soares.syncfast.png
        done
    sources:
      - type: dir
        path: ../..
        skip: [.git, target, .dev, mutants.out, repo, syncfast.flatpak]
      - cargo-sources.json
