name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libdbus-1-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Install rclone
        env:
          RELEASE: v1.76.0
          SHA256: b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7
        run: |
          curl -fsSL -o rclone.zip "https://github.com/rclone/rclone/releases/download/${RELEASE}/rclone-${RELEASE}-linux-amd64.zip"
          echo "${SHA256}  rclone.zip" | sha256sum --check
          unzip -j rclone.zip '*/rclone' -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install restic
        env:
          RESTIC_VERSION: 0.19.1
          RESTIC_SHA256: f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c
        run: |
          curl -fsSL -o restic.bz2 "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2"
          echo "${RESTIC_SHA256}  restic.bz2" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bin"
          bzip2 -dc restic.bz2 > "$RUNNER_TEMP/bin/restic"
          chmod +x "$RUNNER_TEMP/bin/restic"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/restic" version | grep -F "restic ${RESTIC_VERSION} "

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@v2.90.0
        with:
          tool: nextest

      - uses: Swatinem/rust-cache@v2.9.3

      - run: cargo fmt --all --check

      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - run: cargo nextest run --locked --workspace --no-fail-fast
