name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libdbus-1-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Install rclone
        env:
          RELEASE: v1.75.2
          SHA256: 349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702
        run: |
          curl -fsSL -o rclone.zip "https://github.com/rclone/rclone/releases/download/${RELEASE}/rclone-${RELEASE}-linux-amd64.zip"
          echo "${SHA256}  rclone.zip" | sha256sum --check
          unzip -j rclone.zip '*/rclone' -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@v2.90.0
        with:
          tool: nextest

      - uses: Swatinem/rust-cache@v2.9.3

      - run: cargo fmt --all --check

      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - run: cargo nextest run --locked --workspace --no-fail-fast
